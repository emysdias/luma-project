services:
  web:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Source code from the host -> hot reload
      - .:/app
      # Keep the container's own node_modules/.next (host ones are built for another OS)
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      - NEXT_TELEMETRY_DISABLED=1

volumes:
  node_modules:
  next_cache:
